status = warn

appender.console.type = Console
appender.console.name = LogToConsole
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{MM.dd HH:mm:ss.SSS}|%-5level|%-20.20C{1}|%-28M%-5.5L| %m%n
appender.console.layout.charset = UTF-8

appender.rolling.type = RollingFile
appender.rolling.name = LogToRollingFile
appender.rolling.fileName = C:\\Users\\jhu90\\logs\\application.log
appender.rolling.filePattern = C:\\Users\\jhu90\\logs\\$${date:yyyyMM}\\%d{yyyyMMdd}-application-%03i.log.zip
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{MM.dd HH:mm:ss.SSS}|%-5level|%-20.20C{1}|%-28M%-5.5L| %m%n
appender.rolling.layout.charset = UTF-8
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.size.size=10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 1000

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = LogToConsole
rootLogger.appenderRef.rolling.ref = LogToRollingFile

logger.app.name = com.jhu.japi
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRef.console.ref = LogToConsole
logger.app.appenderRef.rolling.ref = LogToRollingFile

